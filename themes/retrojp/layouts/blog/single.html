{{ define "main" }}

<div class="post-header">
  <div class="post-meta">
    <span class="post-date">{{ .Date.Format "2006.01.02" }}</span>
    {{ with .ReadingTime }} · {{ . }} MIN READ{{ end }}
  </div>
  <h1 class="post-title">{{ .Title }}</h1>
  {{ with .GetTerms "tags" }}
  <div class="post-tags">
    {{ range . }}<a class="blog-tag" href="{{ .RelPermalink }}">{{ .Title }}</a>{{ end }}
  </div>
  {{ end }}
</div>

<div class="post-body">
  {{ .Content }}
  <hr>
  <a class="btn" href="{{ "/blog/" | relURL }}" style="font-size:0.45rem">← ALL POSTS</a>
</div>

{{ end }}
