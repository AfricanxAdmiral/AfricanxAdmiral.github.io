{{ define "main" }}
<div class="page-hero">
  <div class="page-hero-label fade-in">{{ site.Params.japaneseTitle }}</div>
  <h1 class="page-hero-title fade-in">{{ .Title | upper }}</h1>
</div>
<div class="blog-list">
  {{ range .Pages }}
  <a href="{{ .RelPermalink }}" style="display:block; text-decoration:none;">
    <div class="blog-post-item fade-in">
      <div class="blog-post-date">{{ .Date.Format "2006.01.02" }}</div>
      <div>
        <div class="blog-post-title">{{ .Title }}</div>
        <div class="blog-post-excerpt">{{ .Summary | truncate 150 }}</div>
        {{ with .GetTerms "tags" }}
        <div class="blog-post-tags" onclick="event.preventDefault()">
          {{ range . }}<a class="blog-tag" href="{{ .RelPermalink }}">{{ .Title }}</a>{{ end }}
        </div>
        {{ end }}
      </div>
    </div>
  </a>
  {{ end }}
</div>
{{ end }}
