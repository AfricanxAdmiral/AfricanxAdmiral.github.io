<nav class="nav">
  <div class="nav-inner">
    <a class="nav-logo" href="{{ "/" | relURL }}">
      <span class="nav-logo-bracket">[</span>{{ site.Params.author }}<span class="nav-logo-bracket">]</span>
    </a>
    <div class="nav-right">
      <ul class="nav-links">
        {{ range site.Menus.main }}
        {{/* Exact match for HOME; section links also stay lit on their child pages */}}
        {{ $active := or (eq $.RelPermalink .URL) (and (ne .URL "/") (hasPrefix $.RelPermalink .URL)) }}
        <li><a href="{{ .URL | relURL }}" class="{{ if $active }}active{{ end }}">{{ .Name }}</a></li>
        {{ end }}
      </ul>
      <div class="nav-sep"></div>
      <button class="theme-toggle" id="theme-toggle" aria-label="toggle light/dark mode" aria-pressed="false">
        <div class="toggle-track"><div class="toggle-thumb"></div></div>
      </button>
    </div>
    <button class="nav-toggle" aria-label="toggle menu">&#9776;</button>
  </div>
</nav>
